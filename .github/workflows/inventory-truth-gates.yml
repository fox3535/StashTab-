name: Inventory truth gates

on:
  pull_request:
    paths:
      - "services/api/**"
      - "docs/inventory-truth-v1/**"
      - ".github/workflows/inventory-truth-gates.yml"

permissions:
  contents: read

jobs:
  # Blocking: inventory-truth acceptance harness on real PostgreSQL.
  # Uses only ephemeral CI credentials (postgres/postgres on localhost);
  # no production or repository secrets are involved.
  pg-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stashtab
          POSTGRES_DB: stashtab_it
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt pytest psycopg2-binary
      - name: Run PostgreSQL acceptance harness (14 criteria)
        env:
          STASHTAB_PG_URL: postgresql+psycopg2://postgres:stashtab@localhost:55432/stashtab_it
        # `python -m pytest` from services/api puts that directory on sys.path.
        # PYTHONPATH is not required for this layout.
        run: python -m pytest tests/test_pg_acceptance.py -q
