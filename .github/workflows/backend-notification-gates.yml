name: Backend notification gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      sqlite: ${{ steps.gate.outputs.sqlite }}
      postgres: ${{ steps.gate.outputs.postgres }}
      contract: ${{ steps.gate.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_pr_gate.py sqlite postgres contract >> "$GITHUB_OUTPUT"

  sqlite:
    needs: paths
    if: needs.paths.outputs.sqlite == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Frozen notification acceptance and complete SQLite suite
        # `python -m pytest` from services/api puts that directory on sys.path.
        # PYTHONPATH is not required for this layout.
        run: python -m pytest tests -q

  postgres:
    needs: paths
    if: needs.paths.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stashtab
          POSTGRES_DB: stashtab_it
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt pytest psycopg2-binary
      - name: Notification PostgreSQL acceptance harness
        env:
          STASHTAB_PG_URL: postgresql+psycopg2://postgres:stashtab@localhost:55432/stashtab_it
          STASHTAB_NOTIFICATION_PG_DESTRUCTIVE_OK: local-stashtab_it-55432
          STASHTAB_NOTIFICATION_MIGRATOR_ROLE: stashtab_notification_migrator
        run: python -m pytest tests/test_notification_pg.py tests/test_notification_pg_112.py -q

  contract:
    needs: paths
    if: needs.paths.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_notification_freeze.py --self-test
      - run: python scripts/validate_notification_freeze.py --manifest docs/backend-notification-integration-v1/freezes/FREEZE-1.1.1-git-canonical.json --negative-check
      - run: python scripts/validate_notification_freeze.py --manifest docs/backend-notification-integration-v1/freezes/FREEZE-1.1.2-git-canonical.json --negative-check
      - run: python scripts/validate_inventory_truth_freeze.py --self-test
      - run: python scripts/validate_inventory_truth_freeze.py --manifest docs/inventory-truth-v1/freezes/FREEZE-1.3.0-git-canonical.json --negative-check
      - run: python scripts/validate_agent_context.py
