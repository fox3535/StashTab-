name: Card resolution contract gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      contract-and-backend: ${{ steps.gate.outputs.contract-and-backend }}
      frontend-build: ${{ steps.gate.outputs.frontend-build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci_pr_gate.py contract-and-backend frontend-build >> "$GITHUB_OUTPUT"

  contract-and-backend:
    needs: paths
    if: needs.paths.outputs.contract-and-backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python ../../scripts/validate_card_resolution_contract.py
      - run: python ../../scripts/validate_agent_context.py
      # `python -m pytest` from services/api puts that directory on sys.path.
      # PYTHONPATH is not required for this layout.
      - run: python -m pytest tests -q

  frontend-build:
    needs: paths
    if: needs.paths.outputs.frontend-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
